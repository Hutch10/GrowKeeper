<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" fill="#f3f4f6"/>
  <g transform="translate(50, 40)">
    <!-- Pot -->
    <path d="M20 120 L30 160 L70 160 L80 120 Z" fill="#d97706"/>
    <rect x="15" y="110" width="70" height="15" rx="3" fill="#b45309"/>
    
    <!-- Plant stem -->
    <path d="M50 110 Q50 80 45 60" stroke="#16a34a" stroke-width="4" fill="none"/>
    <path d="M50 110 Q55 85 60 70" stroke="#16a34a" stroke-width="3" fill="none"/>
    
    <!-- Leaves -->
    <ellipse cx="35" cy="55" rx="15" ry="25" fill="#22c55e" transform="rotate(-30 35 55)"/>
    <ellipse cx="65" cy="60" rx="12" ry="20" fill="#22c55e" transform="rotate(25 65 60)"/>
    <ellipse cx="45" cy="35" rx="10" ry="18" fill="#16a34a" transform="rotate(-10 45 35)"/>
    
    <!-- Leaf details -->
    <path d="M35 40 Q35 55 35 70" stroke="#15803d" stroke-width="1.5" fill="none"/>
    <path d="M65 45 Q65 60 65 75" stroke="#15803d" stroke-width="1.5" fill="none"/>
    <path d="M45 22 Q45 35 45 50" stroke="#166534" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Question mark for unknown plant -->
  <text x="100" y="190" text-anchor="middle" fill="#9ca3af" font-family="Arial" font-size="14">No image</text>
</svg>
